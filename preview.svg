<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1960" viewBox="0 0 1280 980" role="img" aria-labelledby="title desc">
  <title id="title">BotCtrl interface</title>
  <desc id="desc">Annotated Fight and Gear pages for the BotCtrl WotLK playerbot commander.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <style>
      .bg { fill: #12141a; }
      .panel { fill: #0d0d12; stroke: #a68c33; stroke-width: 2; }
      .title { fill: #ffd100; font: 700 18px "Trebuchet MS", "Segoe UI", sans-serif; }
      .sub { fill: #c8b56a; font: 600 13px "Trebuchet MS", "Segoe UI", sans-serif; }
      .chip { stroke: #000; stroke-width: 1; }
      .lbl { fill: #f3f3f3; font: 600 12px "Trebuchet MS", "Segoe UI", sans-serif; text-anchor: middle; }
      .lblk { fill: #f3f3f3; font: 600 11px "Trebuchet MS", "Segoe UI", sans-serif; text-anchor: middle; }
      .key { fill: #ffd940; font: 600 8.5px "Trebuchet MS", "Segoe UI", sans-serif; }
      .roster { font: 600 12px "Segoe UI", "Trebuchet MS", sans-serif; }
      .muted { fill: #9a9a9a; font: 600 11px "Trebuchet MS", "Segoe UI", sans-serif; }
      .status { fill: #e6d48a; font: 600 12px "Trebuchet MS", "Segoe UI", sans-serif; }
      .note { fill: #d8d8d8; font: 500 13px "Segoe UI", sans-serif; }
      .note-strong { fill: #ffd100; font: 700 13px "Segoe UI", sans-serif; }
      .call { fill: #1b1d24; stroke: #c9a227; stroke-width: 1.4; }
      .n { fill: #ffd100; font: 700 12px "Segoe UI", sans-serif; text-anchor: middle; }
      .line { stroke: #c9a227; stroke-width: 1.3; fill: none; }
      .hdr { fill: #ececec; font: 700 22px "Trebuchet MS", "Segoe UI", sans-serif; }
      .tag { fill: #888; font: 500 12px "Segoe UI", sans-serif; }
    </style>
    <!-- one chip body; fill comes from the <use> -->
    <rect id="c" class="chip" width="58" height="22" rx="2"/>
    <!-- padlock, matches Interface\Buttons\LockButton-Unlocked-Up -->
    <g id="lock">
      <rect x="1" y="7" width="12" height="9" rx="1.5" fill="#aaa"/>
      <path d="M3.5 7V4.5a3.5 3.5 0 0 1 7 0V6" fill="none" stroke="#aaa" stroke-width="1.6"/>
    </g>
    <!-- shared header: skull, title, Binds, Setup, lock. First chip differs per page. -->
    <g id="frame">
      <circle cx="22" cy="20" r="8" fill="#1a1a1a" stroke="#ddd" stroke-width="1.2"/>
      <path d="M18 18h8M20 23h4" stroke="#eee" stroke-width="1.1"/>
      <text class="title" x="36" y="25">BotCtrl</text>
      <rect class="chip" x="169" y="8" width="48" height="22" rx="2" fill="#2e2e33"/>
      <text class="lbl" x="193" y="23">Binds</text>
      <rect class="chip" x="220" y="8" width="48" height="22" rx="2" fill="#2e2e33"/>
      <text class="lbl" x="244" y="23">Setup</text>
      <use href="#lock" x="280" y="4"/>
    </g>
    <!-- roster: role tag yellow, names class colored -->
    <g id="roster" class="roster">
      <text x="12" y="48"><tspan fill="#ffd100">T</tspan> <tspan fill="#f58cba">Gerolain</tspan></text>
      <text x="96" y="48" fill="#c69b6d">Odris</text>
      <text x="150" y="48" fill="#69ccf0">Marlesh</text>
      <text x="216" y="48" fill="#fff569">Lelarena</text>
    </g>
  </defs>
  <rect class="bg" width="1280" height="980"/>
  <text class="hdr" x="40" y="42">BotCtrl</text>
  <text class="tag" x="140" y="42">WotLK 3.3.5a playerbot commander: click a chip or use 1-5 / Shift / Ctrl</text>

  <!-- FIGHT PANEL -->
  <g filter="url(#shadow)" transform="translate(330,70)">
    <rect class="panel" rx="6" ry="6" width="322" height="168"/>
    <use href="#frame"/>
    <rect class="chip" x="118" y="8" width="48" height="22" rx="2" fill="#2e2e33"/>
    <text class="lbl" x="142" y="23">Gear</text>
    <use href="#roster"/>

    <!-- party gold -->
    <g transform="translate(8,58)"><use href="#c" fill="#6b4d12"/><text class="key" x="4" y="8">1</text><text class="lblk" x="29" y="19">Follow</text></g>
    <g transform="translate(70,58)"><use href="#c" fill="#6b4d12"/><text class="key" x="4" y="8">2</text><text class="lblk" x="29" y="19">Stay</text></g>
    <g transform="translate(132,58)"><use href="#c" fill="#6b4d12"/><text class="key" x="4" y="8">3</text><text class="lblk" x="29" y="19">Summon</text></g>
    <g transform="translate(194,58)"><use href="#c" fill="#6b4d12"/><text class="key" x="4" y="8">4</text><text class="lblk" x="29" y="19">Drink</text></g>
    <g transform="translate(256,58)"><use href="#c" fill="#6b4d12"/><text class="key" x="4" y="8">5</text><text class="lblk" x="29" y="19">Flee</text></g>

    <!-- tank blue + mark -->
    <g transform="translate(8,84)"><use href="#c" fill="#1a477a"/><text class="key" x="4" y="8">S1</text><text class="lblk" x="29" y="19">Hold</text></g>
    <g transform="translate(70,84)"><use href="#c" fill="#1a477a"/><text class="key" x="4" y="8">S2</text><text class="lblk" x="29" y="19">Pull</text></g>
    <g transform="translate(132,84)"><use href="#c" fill="#1a477a"/><text class="key" x="4" y="8">S3</text><text class="lblk" x="29" y="19">Go</text></g>
    <g transform="translate(194,84)"><use href="#c" fill="#2e2e33"/><text class="lbl" x="29" y="15">Mark</text></g>
    <g transform="translate(256,84)"><use href="#c" fill="#2e2e33"/><text class="lbl" x="29" y="15">Clear</text></g>

    <!-- dps red -->
    <g transform="translate(8,110)"><use href="#c" fill="#7a1f1f"/><text class="key" x="4" y="8">C1</text><text class="lblk" x="29" y="19">Kill</text></g>
    <g transform="translate(70,110)"><use href="#c" fill="#7a1f1f"/><text class="key" x="4" y="8">C2</text><text class="lblk" x="29" y="19">Burn</text></g>
    <g transform="translate(132,110)"><use href="#c" fill="#7a1f1f"/><text class="key" x="4" y="8">C3</text><text class="lblk" x="29" y="19">Skull</text></g>
    <g transform="translate(194,110)"><use href="#c" fill="#7a1f1f"/><text class="key" x="4" y="8">C4</text><text class="lblk" x="29" y="19">Water</text></g>
    <g transform="translate(256,110)"><use href="#c" fill="#24612e"/><text class="key" x="4" y="8">C5</text><text class="lblk" x="29" y="19">Loop</text></g>

    <text class="status" x="12" y="152">1-5 party    Next: Follow</text>
  </g>
  <text class="sub" x="330" y="64">Fight page</text>

  <!-- FIGHT CALLOUTS LEFT (circles sit on the heading row so notes never cross them) -->
  <g>
    <path class="line" d="M318,89 L208,74"/>
    <circle class="call" cx="198" cy="74" r="10"/>
    <text class="n" x="198" y="78">1</text>
    <text class="note-strong" x="40" y="78">Header</text>
    <text class="note" x="40" y="96">Gear / Binds / Setup / lock</text>
    <text class="note" x="40" y="112">Gear swaps this pad for prep.</text>
    <text class="note" x="40" y="128">Binds overlays 1-5 (not permanent).</text>
    <text class="note" x="40" y="144">Setup whispers tank + DPS roles.</text>

    <path class="line" d="M318,114 L208,164"/>
    <circle class="call" cx="198" cy="164" r="10"/>
    <text class="n" x="198" y="168">2</text>
    <text class="note-strong" x="40" y="168">Roster</text>
    <text class="note" x="40" y="186">Left-click locks tank.</text>
    <text class="note" x="40" y="202">Right-click healer / DPS.</text>
    <text class="note" x="40" y="218">Prot pala beats fury warrior.</text>
  </g>

  <!-- FIGHT CALLOUTS RIGHT -->
  <g>
    <path class="line" d="M662,139 L762,74"/>
    <circle class="call" cx="772" cy="74" r="10"/>
    <text class="n" x="772" y="78">3</text>
    <text class="note-strong" x="790" y="78">Party: keys 1-5</text>
    <text class="note" x="790" y="96">Follow, Stay, Summon, Drink, Flee</text>
    <text class="note" x="790" y="112">All bots. Gold row while no modifier.</text>

    <path class="line" d="M662,165 L762,152"/>
    <circle class="call" cx="772" cy="152" r="10"/>
    <text class="n" x="772" y="156">4</text>
    <text class="note-strong" x="790" y="156">Tank: Shift-1/2/3</text>
    <text class="note" x="790" y="174">Hold = follow then stay (tank only)</text>
    <text class="note" x="790" y="190">Pull / Go start the fight</text>
    <text class="note" x="790" y="206">Mark / Clear = icons only, no attack</text>

    <path class="line" d="M662,191 L762,236"/>
    <circle class="call" cx="772" cy="236" r="10"/>
    <text class="n" x="772" y="240">5</text>
    <text class="note-strong" x="790" y="240">DPS: Ctrl-1 to 5</text>
    <text class="note" x="790" y="258">Kill / Burn / Skull / Water / Loop</text>
    <text class="note" x="790" y="274">Skull = rti skull + attack (combat)</text>
    <text class="note" x="790" y="290">Hold Ctrl to arm this row</text>
  </g>

  <!-- GEAR PANEL -->
  <text class="sub" x="330" y="430">Gear page  (header Gear becomes Fight)</text>
  <g filter="url(#shadow)" transform="translate(330,440)">
    <rect class="panel" rx="6" ry="6" width="322" height="168"/>
    <use href="#frame"/>
    <rect class="chip" x="118" y="8" width="48" height="22" rx="2" fill="#6b4d12"/>
    <text class="lbl" x="142" y="23">Fight</text>
    <use href="#roster"/>

    <g transform="translate(8,58)"><use href="#c" fill="#52296b"/><text class="lbl" x="29" y="15">Gear</text></g>
    <g transform="translate(70,58)"><use href="#c" fill="#52296b"/><text class="lbl" x="29" y="15">Maint</text></g>
    <g transform="translate(132,58)"><use href="#c" fill="#52296b"/><text class="lbl" x="29" y="15">Repair</text></g>
    <g transform="translate(194,58)"><use href="#c" fill="#52296b"/><text class="lbl" x="29" y="15">Talent</text></g>
    <g transform="translate(256,58)"><use href="#c" fill="#52296b"/><text class="lbl" x="29" y="15">Train</text></g>

    <g transform="translate(8,84)"><use href="#c" fill="#52296b"/><text class="lbl" x="29" y="15">Sell</text></g>
    <g transform="translate(70,84)"><use href="#c" fill="#52296b"/><text class="lbl" x="29" y="15">Food</text></g>
    <g transform="translate(132,84)"><use href="#c" fill="#52296b"/><text class="lbl" x="29" y="15">Home</text></g>
    <g transform="translate(194,84)"><use href="#c" fill="#52296b"/><text class="lbl" x="29" y="15">Stats</text></g>
    <g transform="translate(256,84)"><use href="#c" fill="#52296b"/><text class="lbl" x="29" y="15">Drink</text></g>

    <g transform="translate(8,110)"><use href="#c" fill="#7a3814"/><text class="lbl" x="29" y="15">Loot</text></g>
    <g transform="translate(70,110)"><use href="#c" fill="#7a3814"/><text class="lbl" x="29" y="15">Reset</text></g>
    <g transform="translate(132,110)"><use href="#c" fill="#7a3814"/><text class="lbl" x="29" y="15">Leave</text></g>

    <text class="status" x="12" y="152" font-size="10.5">Gear page  autogear / repair / talents  (1-5 still combat)</text>
  </g>

  <!-- GEAR CALLOUTS -->
  <g>
    <path class="line" d="M318,459 L208,484"/>
    <circle class="call" cx="198" cy="484" r="10"/>
    <text class="n" x="198" y="488">6</text>
    <text class="note-strong" x="40" y="488">Fight</text>
    <text class="note" x="40" y="506">Same header chip, returns</text>
    <text class="note" x="40" y="522">to the combat pad.</text>
    <text class="note" x="40" y="538">1-5 still fire combat.</text>

    <path class="line" d="M318,509 L208,568"/>
    <circle class="call" cx="198" cy="568" r="10"/>
    <text class="n" x="198" y="572">7</text>
    <text class="note-strong" x="40" y="572">Prep</text>
    <text class="note" x="40" y="590">Gear = autogear</text>
    <text class="note" x="40" y="606">Maint / Repair / Talent / Train</text>
    <text class="note" x="40" y="622">Train needs a trainer targeted</text>

    <path class="line" d="M662,535 L762,484"/>
    <circle class="call" cx="772" cy="484" r="10"/>
    <text class="n" x="772" y="488">8</text>
    <text class="note-strong" x="790" y="488">Bags &amp; camp</text>
    <text class="note" x="790" y="506">Sell greys (vendor targeted)</text>
    <text class="note" x="790" y="522">Food / Home / Stats / Drink</text>
    <text class="note" x="790" y="538">Home needs an innkeeper</text>

    <path class="line" d="M662,561 L762,568"/>
    <circle class="call" cx="772" cy="568" r="10"/>
    <text class="n" x="772" y="572">9</text>
    <text class="note-strong" x="790" y="572">Danger row</text>
    <text class="note" x="790" y="590">Loot = ll normal (skip BoP)</text>
    <text class="note" x="790" y="606">Reset = reset botAI if stuck</text>
    <text class="note" x="790" y="622">Leave = click twice within 4s to confirm</text>
    <text class="note" x="790" y="638">Never bound to 1-5</text>
  </g>

  <!-- footer legend -->
  <rect x="40" y="690" width="1200" height="250" rx="8" fill="#161820" stroke="#3a3420" stroke-width="1"/>
  <text class="title" x="60" y="718">What each control does</text>

  <text class="note-strong" x="60" y="748">1  Header</text>
  <text class="note" x="160" y="748">Gear page toggle. Binds 1-5 overlay. Setup roles once after invite. Padlock locks the bar.</text>
  <text class="note-strong" x="60" y="770">2  Roster</text>
  <text class="note" x="160" y="770">Party names. Left-click = tank. Right-click = healer/DPS. Auto-tank uses RF / shield / stance, not class.</text>
  <text class="note-strong" x="60" y="792">3  Party</text>
  <text class="note" x="160" y="792">1 Follow, 2 Stay, 3 Summon, 4 Drink, 5 Flee. All bots. Gold while no modifier is held.</text>
  <text class="note-strong" x="60" y="814">4  Tank</text>
  <text class="note" x="160" y="814">Shift-1 Hold (come and stay), Shift-2 Pull, Shift-3 Go. Mark paints skull on casters; does not attack. Clear wipes icons.</text>
  <text class="note-strong" x="60" y="836">5  DPS</text>
  <text class="note" x="160" y="836">Ctrl-1 Kill, Ctrl-2 Burn, Ctrl-3 Skull (rti + attack), Ctrl-4 mage water, Ctrl-5 dungeon loop. Combat starts here / Pull / Go.</text>
  <text class="note-strong" x="60" y="858">6-9  Gear</text>
  <text class="note" x="160" y="858">Prep only. Autogear, repair, talents, sell, hearth. Leave arms on the first click and needs a second click within 4s. Keys 1-5 still Follow/Stay/Summon here.</text>
  <text class="muted" x="60" y="890">Hold Shift to arm the tank row, Ctrl to arm DPS. Status line shows the live modifier and the next loop step (or pack marks when Mark is ON).</text>
</svg>
