<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="2080" viewBox="0 0 1280 1040" role="img" aria-labelledby="title desc">
  <title id="title">BotCtrl interface</title>
  <desc id="desc">Annotated Fight and Orders tabs for the BotCtrl WotLK playerbot commander. A tab row switches Fight, Gear, Strat, Orders, and Quest. 1-5 always fight.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <style>
      .bg { fill: #12141a; }
      .panel { fill: #0d0d12; stroke: #a68c33; stroke-width: 2; }
      .title { fill: #ffd100; font: 700 18px "Trebuchet MS", "Segoe UI", sans-serif; }
      .sub { fill: #c8b56a; font: 600 13px "Trebuchet MS", "Segoe UI", sans-serif; }
      .chip { stroke: #000; stroke-width: 1; }
      .lbl { fill: #f3f3f3; font: 600 12px "Trebuchet MS", "Segoe UI", sans-serif; text-anchor: middle; }
      .lblk { fill: #f3f3f3; font: 600 11px "Trebuchet MS", "Segoe UI", sans-serif; text-anchor: middle; }
      .key { fill: #ffd940; font: 600 8.5px "Trebuchet MS", "Segoe UI", sans-serif; }
      .roster { font: 600 12px "Segoe UI", "Trebuchet MS", sans-serif; }
      .muted { fill: #9a9a9a; font: 600 11px "Trebuchet MS", "Segoe UI", sans-serif; }
      .status { fill: #e6d48a; font: 600 12px "Trebuchet MS", "Segoe UI", sans-serif; }
      .note { fill: #d8d8d8; font: 500 13px "Segoe UI", sans-serif; }
      .note-strong { fill: #ffd100; font: 700 13px "Segoe UI", sans-serif; }
      .call { fill: #1b1d24; stroke: #c9a227; stroke-width: 1.4; }
      .n { fill: #ffd100; font: 700 12px "Segoe UI", sans-serif; text-anchor: middle; }
      .line { stroke: #c9a227; stroke-width: 1.3; fill: none; }
      .hdr { fill: #ececec; font: 700 22px "Trebuchet MS", "Segoe UI", sans-serif; }
      .tag { fill: #888; font: 500 12px "Segoe UI", sans-serif; }
      .tab { fill: #f3f3f3; font: 600 11px "Trebuchet MS", "Segoe UI", sans-serif; text-anchor: middle; }
    </style>
    <rect id="c" class="chip" width="58" height="22" rx="2"/>
    <g id="lock">
      <rect x="1" y="7" width="12" height="9" rx="1.5" fill="#aaa"/>
      <path d="M3.5 7V4.5a3.5 3.5 0 0 1 7 0V6" fill="none" stroke="#aaa" stroke-width="1.6"/>
    </g>
    <!-- header: skull, title, Binds, Setup, lock. Tabs are drawn per panel. -->
    <g id="frame">
      <circle cx="22" cy="20" r="8" fill="#1a1a1a" stroke="#ddd" stroke-width="1.2"/>
      <path d="M18 18h8M20 23h4" stroke="#eee" stroke-width="1.1"/>
      <text class="title" x="36" y="25">BotCtrl</text>
      <rect class="chip" x="195" y="8" width="48" height="22" rx="2" fill="#2e2e33"/>
      <text class="lbl" x="219" y="23">Binds</text>
      <rect class="chip" x="246" y="8" width="48" height="22" rx="2" fill="#2e2e33"/>
      <text class="lbl" x="270" y="23">Setup</text>
      <use href="#lock" x="298" y="4"/>
    </g>
    <g id="roster" class="roster">
      <text x="12" y="70"><tspan fill="#ffd100">T</tspan> <tspan fill="#f58cba">Gerolain</tspan></text>
      <text x="96" y="70" fill="#c69b6d">Odris</text>
      <text x="150" y="70" fill="#69ccf0">Marlesh</text>
      <text x="216" y="70" fill="#fff569">Lelarena</text>
    </g>
  </defs>
  <rect class="bg" width="1280" height="1040"/>
  <text class="hdr" x="40" y="36">BotCtrl</text>
  <text class="tag" x="150" y="36">Five tabs. 1-5 / Shift / Ctrl always fight. New tabs are click only.</text>

  <text class="sub" x="330" y="58">Fight tab (default)</text>
  <g filter="url(#shadow)" transform="translate(330,66)">
    <rect class="panel" rx="6" ry="6" width="322" height="220"/>
    <use href="#frame"/>
    <rect class="chip" x="8" y="32" width="58" height="22" rx="2" fill="#6b4d12"/>
    <text class="tab" x="37" y="47">Fight</text>
    <rect class="chip" x="70" y="32" width="58" height="22" rx="2" fill="#2e2e33"/>
    <text class="tab" x="99" y="47">Gear</text>
    <rect class="chip" x="132" y="32" width="58" height="22" rx="2" fill="#2e2e33"/>
    <text class="tab" x="161" y="47">Strat</text>
    <rect class="chip" x="194" y="32" width="58" height="22" rx="2" fill="#2e2e33"/>
    <text class="tab" x="223" y="47">Orders</text>
    <rect class="chip" x="256" y="32" width="58" height="22" rx="2" fill="#2e2e33"/>
    <text class="tab" x="285" y="47">Quest</text>
    <use href="#roster"/>

    <g transform="translate(8,82)"><use href="#c" fill="#6b4d12"/><text class="key" x="4" y="8">1</text><text class="lblk" x="29" y="19">Follow</text></g>
    <g transform="translate(70,82)"><use href="#c" fill="#6b4d12"/><text class="key" x="4" y="8">2</text><text class="lblk" x="29" y="19">Stay</text></g>
    <g transform="translate(132,82)"><use href="#c" fill="#6b4d12"/><text class="key" x="4" y="8">3</text><text class="lblk" x="29" y="19">Summon</text></g>
    <g transform="translate(194,82)"><use href="#c" fill="#6b4d12"/><text class="key" x="4" y="8">4</text><text class="lblk" x="29" y="19">Drink</text></g>
    <g transform="translate(256,82)"><use href="#c" fill="#6b4d12"/><text class="key" x="4" y="8">5</text><text class="lblk" x="29" y="19">Flee</text></g>

    <g transform="translate(8,108)"><use href="#c" fill="#1a477a"/><text class="key" x="4" y="8">S1</text><text class="lblk" x="29" y="19">Hold</text></g>
    <g transform="translate(70,108)"><use href="#c" fill="#1a477a"/><text class="key" x="4" y="8">S2</text><text class="lblk" x="29" y="19">Pull</text></g>
    <g transform="translate(132,108)"><use href="#c" fill="#1a477a"/><text class="key" x="4" y="8">S3</text><text class="lblk" x="29" y="19">Go</text></g>
    <g transform="translate(194,108)"><use href="#c" fill="#2e2e33"/><text class="lbl" x="29" y="15">Mark</text></g>
    <g transform="translate(256,108)"><use href="#c" fill="#2e2e33"/><text class="lbl" x="29" y="15">Clear</text></g>

    <g transform="translate(8,134)"><use href="#c" fill="#7a1f1f"/><text class="key" x="4" y="8">C1</text><text class="lblk" x="29" y="19">Kill</text></g>
    <g transform="translate(70,134)"><use href="#c" fill="#7a1f1f"/><text class="key" x="4" y="8">C2</text><text class="lblk" x="29" y="19">Burn</text></g>
    <g transform="translate(132,134)"><use href="#c" fill="#7a1f1f"/><text class="key" x="4" y="8">C3</text><text class="lblk" x="29" y="19">Skull</text></g>
    <g transform="translate(194,134)"><use href="#c" fill="#7a1f1f"/><text class="key" x="4" y="8">C4</text><text class="lblk" x="29" y="19">Water</text></g>
    <g transform="translate(256,134)"><use href="#c" fill="#24612e"/><text class="key" x="4" y="8">C5</text><text class="lblk" x="29" y="19">Loop</text></g>

    <text class="status" x="12" y="206">1-5 party    Next: Follow</text>
  </g>

  <g>
    <path class="line" d="M318,86 L208,74"/>
    <circle class="call" cx="198" cy="74" r="10"/>
    <text class="n" x="198" y="78">1</text>
    <text class="note-strong" x="40" y="78">Header</text>
    <text class="note" x="40" y="96">Binds / Setup / lock</text>
    <text class="note" x="40" y="112">Setup whispers roles once.</text>
    <text class="note" x="40" y="128">No Gear/Fight toggle.</text>

    <path class="line" d="M318,112 L208,164"/>
    <circle class="call" cx="198" cy="164" r="10"/>
    <text class="n" x="198" y="168">2</text>
    <text class="note-strong" x="40" y="168">Tabs</text>
    <text class="note" x="40" y="186">Fight Gear Strat Orders Quest</text>
    <text class="note" x="40" y="202">Roster stays under the tabs.</text>
    <text class="note" x="40" y="218">1-5 still fight on every tab.</text>
  </g>

  <g>
    <path class="line" d="M662,160 L762,74"/>
    <circle class="call" cx="772" cy="74" r="10"/>
    <text class="n" x="772" y="78">3</text>
    <text class="note-strong" x="790" y="78">Party: keys 1-5</text>
    <text class="note" x="790" y="96">Follow, Stay, Summon, Drink, Flee</text>
    <text class="note" x="790" y="112">Gold while no modifier is held.</text>

    <path class="line" d="M662,186 L762,148"/>
    <circle class="call" cx="772" cy="148" r="10"/>
    <text class="n" x="772" y="152">4</text>
    <text class="note-strong" x="790" y="152">Tank: Shift-1/2/3</text>
    <text class="note" x="790" y="170">Hold, Pull, Go</text>
    <text class="note" x="790" y="186">Mark / Clear stay on this row</text>

    <path class="line" d="M662,212 L762,222"/>
    <circle class="call" cx="772" cy="222" r="10"/>
    <text class="n" x="772" y="226">5</text>
    <text class="note-strong" x="790" y="226">DPS: Ctrl-1 to 5</text>
    <text class="note" x="790" y="244">Kill / Burn / Skull / Water / Loop</text>
    <text class="note" x="790" y="260">These keys never change with the tab.</text>
  </g>

  <text class="sub" x="330" y="348">Orders tab  (same height; status does not jump)</text>
  <g filter="url(#shadow)" transform="translate(330,356)">
    <rect class="panel" rx="6" ry="6" width="322" height="220"/>
    <use href="#frame"/>
    <rect class="chip" x="8" y="32" width="58" height="22" rx="2" fill="#2e2e33"/>
    <text class="tab" x="37" y="47">Fight</text>
    <rect class="chip" x="70" y="32" width="58" height="22" rx="2" fill="#2e2e33"/>
    <text class="tab" x="99" y="47">Gear</text>
    <rect class="chip" x="132" y="32" width="58" height="22" rx="2" fill="#2e2e33"/>
    <text class="tab" x="161" y="47">Strat</text>
    <rect class="chip" x="194" y="32" width="58" height="22" rx="2" fill="#57421a"/>
    <text class="tab" x="223" y="47">Orders</text>
    <rect class="chip" x="256" y="32" width="58" height="22" rx="2" fill="#2e2e33"/>
    <text class="tab" x="285" y="47">Quest</text>
    <use href="#roster"/>

    <g transform="translate(8,82)"><use href="#c" fill="#57421a"/><text class="lbl" x="29" y="15">Release</text></g>
    <g transform="translate(70,82)"><use href="#c" fill="#57421a"/><text class="lbl" x="29" y="15">Revive</text></g>
    <g transform="translate(132,82)"><use href="#c" fill="#57421a"/><text class="lbl" x="29" y="15">Leader</text></g>
    <g transform="translate(194,82)"><use href="#c" fill="#57421a"/><text class="lbl" x="29" y="15">Disp</text></g>

    <g transform="translate(8,108)"><use href="#c" fill="#57421a"/><text class="lbl" x="29" y="15">Gray</text></g>
    <g transform="translate(70,108)"><use href="#c" fill="#57421a"/><text class="lbl" x="29" y="15">LQuest</text></g>
    <g transform="translate(132,108)"><use href="#c" fill="#57421a"/><text class="lbl" x="29" y="15">Skill</text></g>
    <g transform="translate(194,108)"><use href="#c" fill="#57421a"/><text class="lbl" x="29" y="15">All</text></g>

    <g transform="translate(8,134)"><use href="#c" fill="#57421a"/><text class="lbl" x="29" y="15">Open</text></g>
    <g transform="translate(70,134)"><use href="#c" fill="#57421a"/><text class="lbl" x="29" y="15">Vendor</text></g>
    <g transform="translate(132,134)"><use href="#c" fill="#57421a"/><text class="lbl" x="29" y="15">Reset</text></g>

    <g transform="translate(8,160)"><use href="#c" fill="#57421a"/><text class="lbl" x="29" y="15">Attack</text></g>
    <g transform="translate(70,160)"><use href="#c" fill="#57421a"/><text class="lbl" x="29" y="15">Follow</text></g>
    <g transform="translate(132,160)"><use href="#c" fill="#57421a"/><text class="lbl" x="29" y="15">Stay</text></g>
    <g transform="translate(194,160)"><use href="#c" fill="#57421a"/><text class="lbl" x="29" y="15">Pass</text></g>
    <g transform="translate(256,160)"><use href="#c" fill="#57421a"/><text class="lbl" x="29" y="15">Def</text></g>

    <text class="status" x="12" y="206">Orders   1-5 still fight</text>
  </g>

  <g>
    <path class="line" d="M318,450 L208,470"/>
    <circle class="call" cx="198" cy="470" r="10"/>
    <text class="n" x="198" y="474">6</text>
    <text class="note-strong" x="40" y="474">Orders</text>
    <text class="note" x="40" y="492">release, revive, give leader</text>
    <text class="note" x="40" y="508">disperse disable</text>
    <text class="note" x="40" y="524">ll gray / quest / skill / all</text>
    <text class="note" x="40" y="540">Click only. Not a keybind.</text>

    <path class="line" d="M318,528 L208,572"/>
    <circle class="call" cx="198" cy="572" r="10"/>
    <text class="n" x="198" y="576">7</text>
    <text class="note-strong" x="40" y="576">Guards</text>
    <text class="note" x="40" y="594">Vendor needs a non-player.</text>
    <text class="note" x="40" y="610">Reset sends reset, not botAI.</text>
    <text class="note" x="40" y="626">/bot reset still moves the bar.</text>
  </g>

  <g>
    <path class="line" d="M662,528 L762,470"/>
    <circle class="call" cx="772" cy="470" r="10"/>
    <text class="n" x="772" y="474">8</text>
    <text class="note-strong" x="790" y="474">Pets</text>
    <text class="note" x="790" y="492">pet attack / follow / stay</text>
    <text class="note" x="790" y="508">pet passive / pet defensive</text>
    <text class="note" x="790" y="524">open items on the row above</text>

    <path class="line" d="M662,400 L762,572"/>
    <circle class="call" cx="772" cy="572" r="10"/>
    <text class="n" x="772" y="576">9</text>
    <text class="note-strong" x="790" y="576">Other tabs</text>
    <text class="note" x="790" y="594">Gear: autogear, repair, talents</text>
    <text class="note" x="790" y="610">Leave is still two clicks</text>
    <text class="note" x="790" y="626">Strat: co +boost / +aoe / +cc ...</text>
    <text class="note" x="790" y="642">Quest: accept * / talk / quests</text>
  </g>

  <rect x="40" y="760" width="1200" height="250" rx="8" fill="#161820" stroke="#3a3420" stroke-width="1"/>
  <text class="title" x="60" y="788">What each control does</text>
  <text class="note-strong" x="60" y="816">1  Header</text>
  <text class="note" x="160" y="816">Binds overlays 1-5. Setup whispers tank and DPS roles once. Padlock locks the bar.</text>
  <text class="note-strong" x="60" y="838">2  Tabs</text>
  <text class="note" x="160" y="838">Fight, Gear, Strat, Orders, Quest. Not a header Gear/Fight toggle. Roster stays visible.</text>
  <text class="note-strong" x="60" y="860">3-5  Fight</text>
  <text class="note" x="160" y="860">1-5 Follow Stay Summon Drink Flee. Shift Hold Pull Go, plus Mark and Clear. Ctrl Kill Burn Skull Water Loop.</text>
  <text class="note-strong" x="60" y="882">6-8  Orders</text>
  <text class="note" x="160" y="882">Party chat, click only. Vendor needs a non-player. Reset is the stuck-cast order, not reset botAI.</text>
  <text class="note-strong" x="60" y="904">9  Gear / Strat / Quest</text>
  <text class="note" x="160" y="904">Gear keeps autogear, repair, talents, two-click leave. Strat is co/nc clicks. Quest accept and talk need a quest giver.</text>
  <text class="muted" x="60" y="936">Hold Shift to arm the tank row, Ctrl to arm DPS. On other tabs the status line names the tab and notes that 1-5 still fight.</text>
  <text class="muted" x="60" y="958">Strat: co +boost, co -boost, co +aoe, co -aoe, co +assist, co +threat, co +cc, co +avoid aoe, nc +loot, co ?, nc ?.</text>
  <text class="muted" x="60" y="980">Quest: accept *, talk, quests, quests all. Accept and talk refuse a player or an empty target.</text>
</svg>
